spring:
  application:
    name: auth-service
  # Optional local overrides. `.env` is gitignored and never committed
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/authdb}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000   # 24 hours in milliseconds