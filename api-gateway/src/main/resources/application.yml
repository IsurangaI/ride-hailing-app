spring:
  application:
    name: api-gateway
  # Optional local overrides. `.env` is gitignored and never committed — put real
  # secrets there. Both paths are optional so the service starts without it.
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:

        # Auth service — no JWT required (this is how people log in)
        - id: auth-service
          uri: "${AUTH_SERVICE_URI:http://localhost:8081}"
          predicates:
            - Path=/api/auth/**
          # No filters here — auth endpoints are public

        # Location service — JWT required
        - id: location-service
          uri: "${LOCATION_SERVICE_URI:http://localhost:8083}"
          predicates:
            - Path=/api/locations/**
          filters:
            - JwtAuthFilter

        # Booking service — JWT required
        - id: booking-service
          uri: "${BOOKING_SERVICE_URI:http://localhost:8082}"
          predicates:
            - Path=/api/rides/**
          filters:
            - JwtAuthFilter

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  # Must be the EXACT same secret as in auth-service/application.yml
  secret: ${JWT_SECRET}