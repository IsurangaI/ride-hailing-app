name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one service failing doesn't cancel the others
      matrix:
        service: [api-gateway, auth-service, booking-service,
                  location-service, matching-service, fare-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - run: chmod +x ./mvnw        # mvnw is committed as 100644, not executable
        working-directory: ${{ matrix.service }}
      - run: ./mvnw -B verify        # compile + test + lint
        working-directory: ${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: dashboard-ui/package-lock.json }
      - run: npm ci
        working-directory: dashboard-ui
      - run: npm run lint && npm run build
        working-directory: dashboard-ui
